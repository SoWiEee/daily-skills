<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teaching Slides v3 版型路由 Demo</title><style>:root{--bg:#221C34;--text:#F8F6FB;--muted:#B9B1C6;--accent:#FF595A;--cyan:#18C5C8;--surface:rgba(255,255,255,.045);--border:rgba(248,246,251,.16)}*{box-sizing:border-box}body{margin:0;background:#120f1c;color:var(--text);font-family:"Noto Sans TC",sans-serif;display:grid;place-items:center;min-height:100vh}.stage{width:min(96vw,1600px);aspect-ratio:16/9;background:var(--bg);padding:5.2%;position:relative;overflow:hidden}.eyebrow{font:700 1.05vw/1.2 "JetBrains Mono",monospace;color:var(--accent);letter-spacing:.12em}.title{font-size:3.2vw;line-height:1.08;max-width:18ch;margin:.5em 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:2vw;margin-top:2vw}.panel{border:1px solid var(--border);padding:1.4vw}.panel h3{font-size:1.5vw;margin:0 0 .8vw}.flow{display:flex;align-items:center;gap:.8vw;margin-top:1.2vw}.node{padding:.8vw 1vw;border:1px solid var(--border);background:var(--surface);font-size:1.1vw}.arrow{color:var(--accent);font-size:1.7vw}.caption{font-size:1.05vw;color:var(--muted);line-height:1.5}.footer{position:absolute;bottom:3.5%;left:5.2%;font:600 .8vw "JetBrains Mono",monospace;color:var(--muted)}</style></head><body><main class="stage"><div class="eyebrow">LAYOUT DECISION ENGINE</div><div class="title">資訊關係決定版型</div><div class="grid"><section class="panel"><h3>相同維度 → Matched Comparison</h3><p class="caption">左右使用相同標籤與閱讀順序。只有兩邊真的回答同一組問題時才用雙欄比較。</p></section><section class="panel"><h3>連續機制 → Process Flow</h3><div class="flow"><span class="node">輸入</span><span class="arrow">→</span><span class="node">決策</span><span class="arrow">→</span><span class="node">結果</span></div></section></div><div class="footer">anchor → dense → dense → breathing</div></main></body></html>
